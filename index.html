<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb" id="meta-cor">
<script>try { document.documentElement.setAttribute('data-tema', localStorage.getItem('wrkz_tema') || 'claro'); } catch (e) {}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<title>Contas Wesley</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tema claro (padrão): fundo arejado, azul cobalto mais vivo */
  :root {
    --bg:#f5f7fb; --surface:#ffffff; --ink:#1a2233; --muted:#667085; --line:#e5e9f1; --soft:#eef2f8;
    --brand:#2f55d4; --on-brand:#ffffff; --brand-soft:#e8eeff; --hero:#3a63e0; --hero-alerta:#c94a3e; --cc:#2b3a6b;
    --pos:#13845d; --pos-soft:#e2f5ec; --neg:#c8372d; --neg-soft:#fdeceb; --warn:#a8670a; --warn-soft:#fdf3df;
    --sombra:0 1px 2px rgba(26,34,51,.04), 0 6px 18px rgba(26,34,51,.05);
  }
  /* Tema escuro: só quando escolhido em Ajustes (ou no Automático com o celular no modo escuro) */
  :root[data-tema="escuro"] {
    --bg:#0f1115; --surface:#181b21; --ink:#e9ecf2; --muted:#9aa2b1; --line:#2a2f38; --soft:#22262e;
    --brand:#7c9cff; --on-brand:#0b1430; --brand-soft:#1f2a4a; --hero:#2a4bb0; --hero-alerta:#8a2a21; --cc:#26304f;
    --pos:#4fd1a0; --pos-soft:#15362b; --neg:#ff8a7d; --neg-soft:#3b1f1c; --warn:#f0b450; --warn-soft:#3a2d14;
    --sombra:none; color-scheme:dark;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-tema="auto"] {
      --bg:#0f1115; --surface:#181b21; --ink:#e9ecf2; --muted:#9aa2b1; --line:#2a2f38; --soft:#22262e;
      --brand:#7c9cff; --on-brand:#0b1430; --brand-soft:#1f2a4a; --hero:#2a4bb0; --hero-alerta:#8a2a21; --cc:#26304f;
      --pos:#4fd1a0; --pos-soft:#15362b; --neg:#ff8a7d; --neg-soft:#3b1f1c; --warn:#f0b450; --warn-soft:#3a2d14;
      --sombra:none; color-scheme:dark;
    }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; overflow-x:hidden; }
  html { overscroll-behavior-y:none; }  /* sem o "puxar para atualizar" do Chrome; a tela continua rolando */
  body { background:var(--bg); color:var(--ink); font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         -webkit-font-smoothing:antialiased; padding-top:env(safe-area-inset-top,0px); }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .num { font-variant-numeric:tabular-nums; }
  .v-neg { color:var(--neg); } .v-pos { color:var(--pos); } .v-warn { color:var(--warn); }
  .wrap { max-width:1080px; margin:0 auto; padding:12px 14px 130px; }

  header.top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0 16px; }
  .mes { font-size:28px; font-weight:800; letter-spacing:-.8px; line-height:1.1; margin:0; }
  .mes-sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .acoes { display:flex; gap:6px; flex:0 0 auto; }
  .icbtn { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
           display:inline-flex; align-items:center; justify-content:center; padding:0; }

  .hero { background:var(--hero); color:#fff; border-radius:24px; padding:20px 18px 18px; margin-bottom:14px; position:relative; overflow:hidden; }
  .hero::before, .hero::after { content:''; position:absolute; border-radius:50%; pointer-events:none; }
  .hero::before { width:220px; height:220px; right:-70px; top:-90px; border:26px solid rgba(255,255,255,.09); }
  .hero::after { width:120px; height:120px; right:-10px; top:-30px; border:14px solid rgba(255,255,255,.07); }
  .hero > * { position:relative; z-index:1; }
  .hero.alerta { background:var(--hero-alerta); }
  .hero-top { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; }
  .hero-tit { display:flex; align-items:center; gap:2px; }
  .hero .ajuda { color:#fff; opacity:.85; }
  .chip { background:rgba(255,255,255,.16); border-radius:99px; padding:3px 11px; font-weight:700; font-size:12.5px; white-space:nowrap; }
  .big { font-size:42px; font-weight:800; letter-spacing:-1.5px; line-height:1.1; margin:6px 0 4px; }
  .hero-sub { font-size:14.5px; opacity:.92; }
  .regua { margin:20px 0 2px; }
  .trilho { position:relative; height:6px; border-radius:99px; background:rgba(255,255,255,.2); }
  .trilho span { position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:rgba(255,255,255,.7); }
  .trilho i { position:absolute; top:50%; width:14px; height:14px; border-radius:50%; background:#fff;
              transform:translate(-50%,-50%); box-shadow:0 0 0 4px rgba(255,255,255,.25); }
  .regua-leg { display:flex; justify-content:space-between; font-size:12px; opacity:.85; margin-top:9px; }
  .hero-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; margin-top:16px; }
  .hero-grid div { background:rgba(255,255,255,.12); border-radius:14px; padding:10px 12px; min-width:0; }
  .hero-grid small { display:block; font-size:12px; opacity:.85; }
  .hero-grid b { font-size:17px; font-weight:700; }
  @media (max-width:380px) { .big { font-size:35px; } .hero-grid b { font-size:15px; } }

  .cols { display:grid; grid-template-columns:minmax(0,1fr); gap:0 14px; }
  .cols > div { min-width:0; }
  @media (min-width:900px) { .cols { grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:start; } }
  .painel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px 14px; margin-bottom:14px; min-width:0; box-shadow:var(--sombra); }
  .painel h2 { font-size:16.5px; margin:0; letter-spacing:-.2px; }
  .ph { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
  .ph-txt { min-width:0; }
  .ph-dir { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .ajuda { width:32px; height:32px; margin:-4px -6px 0 0; border:0; background:none; color:var(--muted);
           display:inline-flex; align-items:center; justify-content:center; padding:0; border-radius:50%; }
  .sub { color:var(--muted); font-size:13px; }
  .aviso { border-radius:16px; padding:12px 14px; margin-bottom:14px; font-size:14px; font-weight:600; }
  .aviso.neg { background:var(--neg-soft); color:var(--neg); }
  .aviso.warn { background:var(--warn-soft); color:var(--warn); }

  .linha { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14.5px; }
  .linha:last-child { border-bottom:0; }
  .linha .k { color:var(--muted); min-width:0; }
  .linha b { white-space:nowrap; }
  .linha.total { font-weight:800; font-size:16px; border-top:2px solid var(--ink); border-bottom:0; margin-top:6px; padding-top:10px; }
  .linha.total .k { color:var(--ink); }
  .barra { position:relative; height:8px; border-radius:99px; background:var(--soft); overflow:hidden; display:flex; margin:10px 0 6px; }
  .barra span { height:100%; }
  .barra .marca { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); opacity:.55; }

  .item { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); width:100%;
          background:none; border-left:0; border-right:0; border-top:0; text-align:left; min-width:0; }
  .item:last-child { border-bottom:0; }
  .info { flex:1; min-width:0; }
  .nome { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item.ok .nome { color:var(--muted); }
  .valor { text-align:right; white-space:nowrap; font-weight:700; }
  .av { flex:0 0 38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
  .chk { flex:0 0 38px; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface);
         display:inline-flex; align-items:center; justify-content:center; color:var(--muted); padding:0; }
  .chk.feito { background:var(--pos); border-color:var(--pos); color:#fff; }
  .x { border:0; background:none; color:var(--muted); padding:6px; display:inline-flex; flex:0 0 auto; }
  .tag { display:inline-block; font-size:11px; font-weight:700; border-radius:99px; padding:1px 8px; margin-left:6px;
         background:var(--brand-soft); color:var(--brand); vertical-align:1px; }
  .tag.warn { background:var(--warn-soft); color:var(--warn); }
  .tag.bom { background:var(--pos-soft); color:var(--pos); }
  .tag.ruim { background:var(--neg-soft); color:var(--neg); }

  input, select { font:inherit; font-size:16px; color:var(--ink); background:var(--surface); border:1px solid var(--line);
                  border-radius:10px; padding:9px 10px; min-width:0; }
  input:focus, select:focus { outline:none; border-color:var(--brand); }
  .inp-pg { flex:0 0 88px; width:88px; text-align:right; padding:8px; }
  @media (max-width:400px) { .inp-pg { flex-basis:80px; width:80px; } .av { flex-basis:34px; height:34px; } }
  .btn { border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 16px; font-weight:700; }
  .btn.prim { background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
  .btn.full { width:100%; }
  .btn.sm { padding:7px 12px; font-size:13.5px; border-radius:10px; }
  .btn.perigo { color:var(--neg); }
  .vazio { text-align:center; color:var(--muted); padding:22px 8px; font-size:14px; }

  .cat { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .cat svg { width:140px; height:140px; flex:0 0 140px; }
  .leg { flex:1; min-width:170px; }
  .leg .l { display:flex; justify-content:space-between; gap:8px; font-size:13.5px; padding:4px 0; }
  .leg .l span:last-child { color:var(--muted); white-space:nowrap; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; }
  svg text { fill:var(--muted); font-size:11px; font-family:inherit; }
  svg text.dv { fill:var(--ink); font-size:15px; font-weight:800; }

  .cc { background:var(--cc); color:#fff; border-radius:20px; padding:18px 18px 16px; margin-bottom:12px; }
  .cc-top { display:flex; justify-content:space-between; align-items:center; font-size:15px; }
  .cc .ajuda { color:#fff; opacity:.85; }
  .cc .btn { background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.35); color:#fff; }
  .cc-label { font-size:13px; opacity:.85; margin-top:18px; }
  .cc-valor { font-size:30px; font-weight:800; letter-spacing:-1px; }
  .cc-rodape { font-size:12.5px; opacity:.8; margin-top:10px; }
  .fat-edit { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
  .fat-edit:last-child { border-bottom:0; }
  .fat-edit .inp-pg { flex-basis:110px; width:110px; }

  .ind { padding:12px 0; border-bottom:1px solid var(--line); }
  .ind:last-child { border-bottom:0; }
  .ind-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .ind-val { font-size:22px; font-weight:800; letter-spacing:-.5px; }
  .evento { display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:4px 0; }
  .evento span:first-child { color:var(--muted); }

  nav.tab { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
            display:grid; grid-template-columns:repeat(5,1fr); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); }
  nav.tab button { border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:2px;
                   font-size:11px; font-weight:700; color:var(--muted); padding:4px 0; }
  nav.tab button.on { color:var(--brand); }
  nav.tab .mais { width:54px; height:54px; border-radius:50%; background:var(--brand); color:var(--on-brand);
                  display:flex; align-items:center; justify-content:center; margin-top:-24px; box-shadow:0 6px 18px rgba(47,85,212,.35); }
  @media (min-width:700px) {
    nav.tab { left:50%; right:auto; width:480px; transform:translateX(-50%); bottom:16px; border:1px solid var(--line); border-radius:22px; }
  }

  #veu { position:fixed; inset:0; background:rgba(10,12,18,.5); z-index:30; display:none; align-items:flex-end; justify-content:center; }
  #veu.aberto { display:flex; }
  #folha { background:var(--surface); width:100%; max-width:560px; border-radius:24px 24px 0 0;
           padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px)); max-height:92vh; overflow:auto; overscroll-behavior:contain; animation:sobe .22s ease-out; }
  @media (min-width:700px) { #veu { align-items:center; } #folha { border-radius:24px; } }
  @keyframes sobe { from { transform:translateY(24px); opacity:.6; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { #folha { animation:none; } }
  .alca { width:44px; height:5px; border-radius:99px; background:var(--muted); opacity:.35; margin:0 auto 14px; position:relative; }
  .alca::before { content:''; position:absolute; left:-40px; right:-40px; top:-14px; bottom:-14px; }  /* área de toque maior */
  #folha.arrastando { animation:none; transition:none; }
  #folha.voltando { transition:transform .2s ease-out; }
  .ftit { font-size:19px; margin:0 0 14px; letter-spacing:-.3px; }
  .bloco h3 { font-size:14px; margin:0 0 4px; color:var(--brand); }
  .bloco p { margin:0 0 16px; font-size:14.5px; line-height:1.6; }
  .seg { display:grid; grid-template-columns:repeat(3,1fr); background:var(--soft); border-radius:12px; padding:4px; gap:4px; margin-bottom:16px; }
  .seg.seg4 { grid-template-columns:repeat(4,1fr); margin-bottom:14px; }
  .seg button { border:0; background:none; border-radius:9px; padding:9px 0; font-weight:700; color:var(--muted); font-size:14px; }
  .seg.seg4 button { font-size:13px; }
  .seg.seg5 { grid-template-columns:repeat(5,1fr); margin-bottom:14px; }
  .seg.seg5 button { font-size:12px; padding:9px 0; }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .valor-grande { width:100%; font-size:34px; font-weight:800; text-align:center; border:0; border-bottom:2px solid var(--line);
                  border-radius:0; padding:6px 0 8px; background:none; margin-bottom:16px; }
  .campo { display:block; margin-bottom:12px; }
  .campo > span { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; font-weight:600; }
  .campo input, .campo select { width:100%; }
  .par { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .previa { background:var(--brand-soft); color:var(--brand); border-radius:12px; padding:10px 12px; font-size:13.5px; font-weight:700; margin-bottom:14px; }
  .dica { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .check { display:flex; align-items:center; gap:10px; margin-bottom:14px; font-weight:600; }
  .check input { width:20px; height:20px; }
  .botoes { display:flex; gap:10px; }
  .botoes .btn { flex:1; }
  .sec { font-size:14px; font-weight:800; margin:16px 0 2px; }
  .dia-cab { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; color:var(--muted); margin:14px 0 0; text-transform:none; }
  .dia-cab:first-child { margin-top:2px; }
  .dia-cab.hoje { color:var(--brand); }
  .marco { display:flex; justify-content:space-between; gap:10px; background:var(--pos-soft); color:var(--pos); border-radius:12px;
           padding:9px 12px; font-size:13.5px; font-weight:700; margin:12px 0 2px; }
  .item.link { cursor:pointer; }
  .dt { flex:0 0 44px; height:44px; border-radius:12px; background:var(--soft); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; }
  .dt b { font-size:16px; } .dt small { font-size:10.5px; color:var(--muted); font-weight:700; }
  .dt.atraso { background:var(--neg-soft); color:var(--neg); } .dt.atraso small { color:var(--neg); }
  .dt.perto { background:var(--warn-soft); color:var(--warn); } .dt.perto small { color:var(--warn); }

  .sim-res { position:sticky; top:-10px; z-index:2; background:var(--surface); padding:4px 0 12px; margin-bottom:6px; border-bottom:1px solid var(--line); }
  .sim-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
  .sim-box { background:var(--soft); border-radius:14px; padding:10px 12px; min-width:0; }
  .sim-box small { display:block; font-size:12px; color:var(--muted); }
  .sim-box b { font-size:17px; }
  .sim-box .sub { font-size:12px; }
  .sim-box.cheio { grid-column:1 / -1; }
  .item.fora .nome { text-decoration:line-through; color:var(--muted); }
  .item input[type=checkbox] { width:22px; height:22px; flex:0 0 22px; }

  #toast { position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(8px); background:var(--ink); color:var(--bg);
           padding:10px 18px; border-radius:99px; font-size:14px; font-weight:600; opacity:0; transition:all .2s; pointer-events:none; z-index:40; }
  #toast.show { opacity:1; transform:translateX(-50%); }
  #toast.err { background:var(--neg); color:#fff; }
  /* Tela de bloqueio (PIN e biometria) */
  #trava { position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column; align-items:center;
           justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px); overflow-y:auto; }
  #trava[hidden] { display:none; }
  .tv-ico { width:56px; height:56px; border-radius:18px; background:var(--hero); color:#fff; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .tv-tit { font-size:22px; font-weight:800; letter-spacing:-.4px; margin:0; text-align:center; }
  .tv-sub { color:var(--muted); font-size:14px; margin:4px 0 24px; text-align:center; max-width:300px; }
  .tv-pontos { display:flex; gap:16px; margin-bottom:12px; }
  .tv-pontos i { width:14px; height:14px; border-radius:50%; border:2px solid var(--muted); transition:background .12s; }
  .tv-pontos i.on { background:var(--brand); border-color:var(--brand); }
  .tv-pontos.erro { animation:tremer .35s; }
  @keyframes tremer { 25% { transform:translateX(-9px); } 75% { transform:translateX(9px); } }
  @media (prefers-reduced-motion: reduce) { .tv-pontos.erro { animation:none; } }
  .tv-msg { min-height:42px; font-size:13.5px; color:var(--neg); font-weight:600; margin-bottom:10px; text-align:center; max-width:300px; }
  .tv-msg.neutro { color:var(--muted); }
  .tv-teclado { display:grid; grid-template-columns:repeat(3, 72px); gap:14px 24px; }
  .tv-teclado button { width:72px; height:72px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
                       font-size:26px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0; }
  .tv-teclado button.sem { border:0; background:transparent; }
  .tv-teclado button:active { background:var(--brand-soft); }
  .tv-link { margin-top:22px; background:none; border:0; color:var(--brand); font-weight:700; font-size:14px; padding:8px; }
  /* Modo discreto: valores trocados por R$ •••• e campos de valor mascarados */
  body.discreto input.num, body.discreto .inp-pg { -webkit-text-security:disc; }
  /* Calendário da agenda */
  .cal { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:5px; margin-top:12px; }
  .cal-sem { text-align:center; font-size:11.5px; color:var(--muted); font-weight:700; padding-bottom:2px; }
  .cal-d { aspect-ratio:1 / 1.05; border:0; border-radius:12px; background:var(--soft); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:3px; padding:0; font-weight:700; font-size:14.5px; min-width:0; }
  .cal-d.fora { background:transparent; }
  .cal-d small { font-size:9.5px; line-height:1; color:var(--brand); font-weight:800; }
  .cal-d.hoje { box-shadow:inset 0 0 0 2px var(--brand); }
  .cal-d.sal { background:var(--pos-soft); color:var(--pos); }
  .cal-d.sel { background:var(--brand); color:var(--on-brand); box-shadow:none; }
  .cal-d.sel small { color:var(--on-brand); }
  .cal-pts { display:flex; gap:3px; height:6px; }
  .cal-pts i { width:6px; height:6px; border-radius:50%; background:var(--brand); }
  .cal-pts i.atraso { background:var(--neg); } .cal-pts i.perto { background:var(--warn); }
  .cal-pts i.ok { background:var(--pos); } .cal-pts i.rec { background:transparent; box-shadow:inset 0 0 0 1.5px var(--pos); }
  .cal-d.sel .cal-pts i[class=""] { background:var(--on-brand); }
  .cal-d.sel .cal-pts i.rec { box-shadow:inset 0 0 0 1.5px var(--on-brand); }
  .cal-leg { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); margin:12px 0 2px; }
  .cal-leg span { display:inline-flex; align-items:center; gap:5px; }
  .cal-leg i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .cal-dia { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .cal-dia h3 { font-size:14px; margin:0 0 2px; }
  /* Faixa de internet e alterações pendentes */
  .faixa { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--warn-soft); color:var(--warn);
           border-radius:14px; padding:10px 12px; font-size:13.5px; font-weight:700; margin-bottom:12px; }
  .faixa.ok { background:var(--brand-soft); color:var(--brand); }
  .faixa .btn { flex:0 0 auto; }
  /* Configurações */
  .cfg-status { background:var(--soft); border-radius:12px; padding:10px 12px; font-size:13.5px; margin:-2px 0 12px; }
  .cfg-status b { display:block; font-size:14px; }
  .versao { text-align:center; color:var(--muted); font-size:12px; margin-top:14px; }
  /* Lançamento rápido */
  .rapido { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin:0 0 14px; }
  .rapido button { border:1px solid var(--line); background:var(--soft); border-radius:14px; padding:10px 4px; font-size:12.5px; font-weight:700;
                   display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--brand); }
  .rapido button span { color:var(--ink); }
  .scan { position:relative; border-radius:18px; overflow:hidden; background:#000; aspect-ratio:4 / 3; margin-bottom:12px; }
  .scan video { width:100%; height:100%; object-fit:cover; display:block; }
  .scan-mira { position:absolute; left:8%; right:8%; top:30%; bottom:30%; border:3px solid rgba(255,255,255,.85); border-radius:14px; box-shadow:0 0 0 999px rgba(0,0,0,.35); }
  .voz-btn { width:96px; height:96px; border-radius:50%; border:0; background:var(--brand); color:var(--on-brand); display:flex; align-items:center;
             justify-content:center; margin:18px auto 10px; }
  .voz-btn.ouvindo { animation:pulsar 1.2s infinite; }
  @keyframes pulsar { 0% { box-shadow:0 0 0 0 rgba(47,85,212,.45); } 100% { box-shadow:0 0 0 22px rgba(47,85,212,0); } }
  @media (prefers-reduced-motion: reduce) { .voz-btn.ouvindo { animation:none; outline:4px solid var(--brand-soft); } }
  .voz-txt { text-align:center; font-size:15px; min-height:44px; margin:0 0 6px; }
  .ocr-barra { height:6px; border-radius:99px; background:var(--soft); overflow:hidden; margin:6px 0 4px; }
  .ocr-barra span { display:block; height:100%; width:0; background:var(--brand); transition:width .3s; }
  /* Lembrete, alertas, comparativo e desfazer */
  .painel.lembrete { border:1.5px solid var(--warn); }
  .alerta-item { display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .alerta-item:first-of-type { border-top:0; }
  .alerta-item .pt { flex:0 0 10px; height:10px; border-radius:50%; margin-top:6px; background:var(--brand); }
  .alerta-item .pt.neg { background:var(--neg); } .alerta-item .pt.warn { background:var(--warn); }
  .alerta-item b { display:block; font-size:14.5px; }
  .alerta-item p { margin:2px 0 0; font-size:13.5px; color:var(--muted); }
  .cmp { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:2px 12px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:14px; }
  .cmp:first-of-type { border-top:0; }
  .cmp small { color:var(--muted); font-size:12px; display:block; }
  .cmp .dif { font-size:12.5px; font-weight:800; min-width:58px; text-align:right; }
  #desfazer { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom,0px)); z-index:41;
              background:var(--ink); color:var(--bg); border-radius:16px; padding:8px 8px 8px 16px; display:flex; align-items:center; gap:12px;
              font-size:14px; font-weight:600; width:min(92vw, 460px); box-shadow:0 6px 24px rgba(0,0,0,.18); }
  #desfazer[hidden] { display:none; }
  #desfazer span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #desfazer button { border:0; background:transparent; color:var(--brand-soft); font-weight:800; padding:8px 10px; border-radius:10px; }
  #busy { position:fixed; top:0; left:0; height:3px; width:0; background:var(--brand); transition:width .4s; z-index:50; }
</style>

// ---------- utilidades ----------
var FMT = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
function brl(n) { return DISCRETO ? 'R$ ••••' : FMT.format(Number(n) || 0); }
function sinal(n) { return (n > 0 ? '+' : '') + brl(n); }
function pctTxt(n) { return Math.round(n * 100) + '%'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function dec(n) { return n === '' || n == null ? '' : Number(n).toFixed(2).replace('.', ','); }
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function cor(c) { return COR[c] || COR['Outros']; }
function val(id) { var e = document.getElementById(id); return e ? e.value : ''; }
function parse(s) {
  s = String(s).replace(/R\$|\s/g, '');
  if (s === '') return '';
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  var n = Number(s);
  return isNaN(n) ? NaN : n;
}
function opts(lista, atual) {
  return lista.map(function (o) {
    var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o;
    return '<option value="' + esc(v) + '"' + (String(v) === String(atual) ? ' selected' : '') + '>' + esc(t) + '</option>';
  }).join('');
}
function somaC(k, n) { var p = k.split('-').map(Number), t = p[0] * 12 + (p[1] - 1) + n; return Math.floor(t / 12) + '-' + String(t % 12 + 1).padStart(2, '0'); }
function difC(a, b) { var pa = a.split('-').map(Number), pb = b.split('-').map(Number); return (pb[0] - pa[0]) * 12 + (pb[1] - pa[1]); }
function nomeC(k) { var p = k.split('-'); return MES_CURTO[Number(p[1]) - 1] + '/' + p[0]; }
function longoC(k) { return MES_LONGO[Number(k.split('-')[1]) - 1]; }
function avatar(nome, cat) {
  var c = cor(cat), desenho = ICO_CAT[cat];
  var dentro = desenho ? '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + desenho + '</svg>'
                       : esc(String(nome).charAt(0).toUpperCase());
  return '<span class="av" style="background:' + c + '1f;color:' + c + '">' + dentro + '</span>';
}
function linha(rotulo, v, classe) {
  return '<div class="linha' + (classe === 'total' ? ' total' : '') + '"><span class="k">' + rotulo + '</span><b class="num ' +
    (classe === 'cor' || classe === 'total' ? (v < 0 ? 'v-neg' : '') : '') + '">' + brl(v) + '</b></div>';
}
function ajuda(k) { return '<button class="ajuda" data-act="ajuda" data-k="' + k + '" aria-label="Entender este painel">' + ico('i', 19) + '</button>'; }
function cab(titulo, sub, chave, dir) {
  return '<div class="ph"><div class="ph-txt"><h2>' + titulo + '</h2>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' +
    '<div class="ph-dir">' + (dir || '') + (chave ? ajuda(chave) : '') + '</div></div>';
}

// ---------- datas pela ótica do salário (mesmas regras do servidor) ----------
function pad2(n) { return String(n).padStart(2, '0'); }
function diaUtil(k) {
  var p = k.split('-').map(Number);
  for (var d = 1; d <= 7; d++) { var s = new Date(Date.UTC(p[0], p[1] - 1, d)).getUTCDay(); if (s !== 0 && s !== 6) return k + '-' + pad2(d); }
}
function dataNoMes(k, dia) {
  var p = k.split('-').map(Number), ultimo = new Date(Date.UTC(p[0], p[1], 0)).getUTCDate();
  return k + '-' + pad2(Math.min(Math.max(1, dia), ultimo));
}
function cicloDaData(iso) { var k = iso.slice(0, 7); return iso < diaUtil(k) ? somaC(k, -1) : k; }
function dataConta(k, dia, seguinte) { return dia ? dataNoMes(seguinte ? somaC(k, 1) : k, dia) : ''; }
function difDias(a, b) {
  var pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
}
function ddmm(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : ''; }
function semana(iso) { var p = iso.split('-').map(Number); return SEMANA[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()]; }

// Em qual ciclo a compra no cartão será paga.
function cicloCompra(iso, k) {
  var p = iso.split('-').map(Number), mes = p[0] + '-' + pad2(p[1]);
  if (!k || !k.fech || !k.venc) return somaC(mes, 1);
  var fecha = p[2] <= k.fech ? mes : somaC(mes, 1);
  var mesVenc = k.venc > k.fech ? fecha : somaC(fecha, 1);
  return cicloDaData(dataNoMes(mesVenc, k.venc));
}

var toastT;
function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, err ? 5000 : 1600);
}
function busy(on) { document.getElementById('busy').style.width = on ? '70%' : '0'; }

// ---------- comunicação com o servidor (API do Apps Script) ----------
// A URL e a chave ficam só neste aparelho, dentro de um cofre criptografado pelo PIN.
// Enquanto o app está desbloqueado, elas ficam só na memória (variável CX).
function conexao() { return CX; }
function apiCom(cx, fn, args) {
  // Sem cabeçalho Content-Type de propósito: assim o navegador manda como texto simples e o Apps Script aceita.
  return fetch(cx.url, { method: 'POST', redirect: 'follow', body: JSON.stringify({ chave: cx.chave, fn: fn, args: args || [], id: arguments[3] || '' }) })
    .catch(function () { var e = new Error('Sem conexão com o servidor.'); e.rede = true; throw e; })
    .then(function (r) { if (!r.ok) { var e = new Error('O servidor respondeu com erro ' + r.status + '.'); e.rede = r.status >= 500; throw e; } return r.json(); })
    .then(function (j) {
      if (!j.ok) { var e = new Error(j.erro || 'Erro no servidor.'); e.chave = j.erro === 'Chave inválida.'; throw e; }
      return j.dados;
    });
}
function api(fn, args) {
  if (!CX) return Promise.reject(new Error('O app está bloqueado.'));
  return apiCom(CX, fn, args);
}
function falha(e) {
  if (e.chave) { toast('A chave foi recusada. Confira a conexão.', true); telaConexao(); return; }
  toast(navigator.onLine ? 'Erro: ' + e.message : 'Sem internet. Tente de novo quando conectar.', true);
  if (!D) document.getElementById('app').innerHTML = '<div class="vazio">Não foi possível carregar suas contas.<br>' +
    '<div class="botoes" style="margin-top:12px"><button class="btn" data-act="recarregar">Tentar de novo</button>' +
    '<button class="btn" data-act="conexao">Conexão</button></div></div>';
}
function load() {
  if (!CX) { if (lerCofre()) mostrarTrava('abrir', '', true); else telaConexao(); return; }
  busy(true);
  carregarLocal()
    .then(function () {
      if (!D && CACHE && CACHE.D) { D = CACHE.D; DADOS_EM = CACHE.em; render(); }   // mostra a cópia do aparelho na hora
      return api('getDados');
    })
    .then(function (d) {
      busy(false); D = d; DADOS_EM = Date.now(); MODO_OFF = false;
      render(); atalho(); salvarCache(); sincronizar();
    })
    .catch(function (e) {
      busy(false);
      if (e.rede && D) { MODO_OFF = true; render(); atalho(); toast('Sem internet: mostrando os últimos dados guardados'); return; }
      falha(e);
    });
}

// Alterações que mexem em linhas da planilha pelo número: só com internet e sem nada na fila,
// para não acertar a linha errada.
var SO_ONLINE = ['efetivar', 'excluirLancamento', 'editarLancamento', 'fecharCiclo'];
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (SO_ONLINE.indexOf(fn) >= 0 && (MODO_OFF || FILA.length)) {
    toast(MODO_OFF ? 'Isso precisa de internet. Tente quando conectar.' : 'Espere as alterações pendentes serem enviadas.', true);
    return;
  }
  var op = { id: novoId(), fn: fn, args: args, em: Date.now() }, desfazendo = DESFAZENDO, antes = D;
  DESFAZENDO = false;
  if (MODO_OFF || FILA.length) { enfileirar(op); return; }
  busy(true);
  enviarOp(op)
    .then(function (d) {
      busy(false); D = d; DADOS_EM = Date.now(); depoisDeSalvar(); salvarCache();
      if (desfazendo) toast('Desfeito'); else if (!oferecerDesfazer(op, antes, d)) toast('Salvo');
    })
    .catch(function (e) {
      busy(false);
      if (e.rede) { MODO_OFF = true; enfileirar(op); return; }
      if (e.chave) { falha(e); return; }
      toast(e.message, true); load();
    });
}
function depoisDeSalvar() {
  if (FOLHA === 'ajustes') folhaAjustes(); else fecharFolha();
  render();
}

// ---------- off-line: cópia local criptografada e fila de alterações ----------
// A cópia dos dados e a fila ficam no aparelho criptografadas com a mesma chave do cofre (só abrem com PIN ou digital).
var K_CACHE = 'wrkz_cache', K_FILA = 'wrkz_fila';
var LOCAL_OK = false, CACHE = null, FILA = [], APRENDIDAS = {}, MODO_OFF = false, DADOS_EM = 0, SINC = false;

function novoId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Array.prototype.map.call(rnd(16), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
}
function lerCifrado(k) {
  var o = localStorage.getItem(k);
  if (!o || !DKRAW) return Promise.resolve(null);
  return aesKey(DKRAW).then(function (key) { return decifrar(key, JSON.parse(o)); }).then(function (b) { return JSON.parse(TD.decode(b)); });
}
function gravarCifrado(k, obj) {
  if (!DKRAW) return Promise.resolve();
  return aesKey(DKRAW).then(function (key) { return cifrar(key, TE.encode(JSON.stringify(obj))); })
    .then(function (c) { try { localStorage.setItem(k, JSON.stringify(c)); } catch (e) {} });
}
function carregarLocal() {
  if (LOCAL_OK) return Promise.resolve();
  return Promise.all([lerCifrado(K_CACHE).catch(function () { return null; }), lerCifrado(K_FILA).catch(function () { return null; })])
    .then(function (r) { CACHE = r[0]; FILA = r[1] || []; APRENDIDAS = (CACHE && CACHE.aprendidas) || {}; LOCAL_OK = true; });
}
function salvarCache() {
  if (!D || !DKRAW) return;
  CACHE = { D: D, em: DADOS_EM || Date.now(), aprendidas: APRENDIDAS };
  gravarCifrado(K_CACHE, CACHE);
}
function salvarFila() { return gravarCifrado(K_FILA, FILA); }
function enviarOp(op) { return apiCom(CX, op.fn, op.args, op.id); }

function enfileirar(op) {
  FILA.push(op); salvarFila();
  if (FOLHA !== 'ajustes') fecharFolha();
  render();
  mostrarDesfazer(MODO_OFF ? 'Guardado no aparelho até a internet voltar' : 'Na fila para enviar', function () {
    var i = FILA.indexOf(op);
    if (i < 0) { toast('Já foi enviado. Desfaça pela tela.', true); return; }
    FILA.splice(i, 1); salvarFila(); render(); toast('Desfeito');
  });
  if (!MODO_OFF) sincronizar();
}

// Envia a fila na ordem, uma alteração por vez. Cada uma leva seu ID: o servidor não lança duas vezes.
function sincronizar() {
  if (SINC || !CX || !FILA.length) return;
  SINC = true;
  var enviadas = 0;
  (function proxima() {
    if (!CX) { SINC = false; return; }
    if (!FILA.length) {
      SINC = false; MODO_OFF = false; DADOS_EM = Date.now();
      render(); salvarCache();
      if (enviadas) toast(enviadas === 1 ? '1 alteração enviada' : enviadas + ' alterações enviadas');
      if (FOLHA === 'fila') folhaFila();
      return;
    }
    var op = FILA[0];
    enviarOp(op)
      .then(function (d) { if (!CX) { SINC = false; return; } D = d; FILA.shift(); enviadas++; salvarFila().then(proxima); })
      .catch(function (e) {
        if (e.rede) { SINC = false; MODO_OFF = true; render(); return; }
        if (e.chave) { SINC = false; falha(e); return; }
        FILA.shift(); salvarFila();
        toast('Não deu para enviar "' + rotuloOp(op) + '": ' + e.message, true);
        proxima();
      });
  })();
}
window.addEventListener('online', function () {
  if (!CX) return;
  if (FILA.length) sincronizar(); else if (MODO_OFF) atualizarSilencioso();
});
setInterval(function () {
  if (!CX || !navigator.onLine || SINC) return;
  if (FILA.length) sincronizar(); else if (MODO_OFF) atualizarSilencioso();
}, 30000);
function atualizarSilencioso() {
  api('getDados').then(function (d) { D = d; DADOS_EM = Date.now(); MODO_OFF = false; render(); salvarCache(); }).catch(function () {});
}

function rotuloOp(op) {
  var a = op.args || [], x = a[0];
  if (op.fn === 'lancar' && x) return x.tipo + ': ' + x.desc + ' (' + brl(x.valor) + (x.parcelas > 1 ? ' em ' + x.parcelas + 'x' : '') + ')';
  if (op.fn === 'pagarConta' || op.fn === 'ajustarConta') {
    var c = (D && D.fixas || []).filter(function (f) { return f.id === a[0]; })[0];
    return (op.fn === 'pagarConta' ? 'Pagar ' : 'Valor do mês: ') + (c ? c.nome : 'conta') + (a[1] !== '' && a[1] != null ? ' (' + brl(a[1]) + ')' : '');
  }
  if (op.fn === 'pagarFatura' || op.fn === 'definirFatura') {
    var f = (D && D.faturas || []).filter(function (k) { return k.id === a[0]; })[0];
    var v = op.fn === 'pagarFatura' ? a[1] : a[2];
    return (op.fn === 'pagarFatura' ? 'Pagar fatura ' : 'Valor da fatura ') + (f ? f.nome : '') + (v !== '' && v != null ? ' (' + brl(v) + ')' : '');
  }
  if (op.fn === 'salvarConfig') return 'Ajuste: ' + a[0];
  return { desfazerConta: 'Desfazer pagamento', desfazerFatura: 'Desfazer pagamento da fatura', salvarConta: 'Salvar conta', excluirConta: 'Excluir conta',
           salvarVencimento: 'Mudar vencimento', salvarCartao: 'Mudar datas do cartão', salvarObjetivo: 'Salvar meta', excluirObjetivo: 'Excluir meta',
           depositarObjetivo: 'Movimentar meta' }[op.fn] || op.fn;
}

// Faixa no topo das telas: sem internet e/ou alterações aguardando.
function faixaSync() {
  if (!MODO_OFF && !FILA.length) return '';
  var quando = DADOS_EM ? new Date(DADOS_EM) : null;
  var txt = MODO_OFF ? 'Sem internet' + (quando ? '. Dados de ' + pad2(quando.getDate()) + '/' + pad2(quando.getMonth() + 1) + ' às ' + pad2(quando.getHours()) + ':' + pad2(quando.getMinutes()) : '') : 'Enviando para a planilha…';
  if (FILA.length) txt += '. ' + FILA.length + (FILA.length === 1 ? ' alteração aguardando' : ' alterações aguardando');
  return '<div class="faixa' + (MODO_OFF ? '' : ' ok') + '" role="status"><span>' + txt + '</span>' +
    (FILA.length ? '<button class="btn sm" data-act="fila">Ver</button>' : '') + '</div>';
}
function folhaFila() {
  var gastos = 0;
  FILA.forEach(function (op) {
    var x = op.args && op.args[0];
    if (op.fn === 'lancar' && x && (x.situacao || 'pago') === 'pago' && x.tipo !== 'Cartão') gastos += x.tipo === 'Entrada' ? -x.valor : x.valor;
  });
  var h = '<h2 class="ftit">Aguardando envio</h2>' +
    '<p class="dica">Estas alterações estão guardadas no aparelho e vão para a planilha, nesta ordem, assim que a internet voltar. ' +
    'Os totais das telas só se atualizam depois do envio.</p>';
  if (gastos && D) h += '<div class="cfg-status"><b class="num">' + brl(D.livre - gastos) + '</b>Livre até o salário, estimado com o que está na fila</div>';
  h += FILA.length ? FILA.map(function (op, i) {
    var em = new Date(op.em);
    return '<div class="item"><span class="av" style="background:var(--warn-soft);color:var(--warn)">' + ico('nuvem', 18) + '</span>' +
      '<div class="info"><div class="nome">' + esc(rotuloOp(op)) + '</div><div class="sub">Feito ' + pad2(em.getDate()) + '/' + pad2(em.getMonth() + 1) + ' às ' + pad2(em.getHours()) + ':' + pad2(em.getMinutes()) + '</div></div>' +
      '<button class="btn sm perigo" data-act="fila-tirar" data-i="' + i + '">Tirar</button></div>';
  }).join('') : '<div class="vazio">Nada aguardando. Tudo já está na planilha.</div>';
  h += '<div class="botoes" style="margin-top:14px"><button class="btn" data-act="fechar-folha">Fechar</button>' +
    (FILA.length ? '<button class="btn prim" data-act="fila-enviar">Enviar agora</button>' : '') + '</div>';
  abrirFolha('fila', h);
}
function tirarDaFila(i) {

// ---------- segurança: cofre criptografado, PIN, biometria e bloqueio automático ----------
// Como funciona:
// - Uma chave aleatória (DK) criptografa a URL e a chave da API (AES-GCM, 256 bits).
// - A DK fica guardada duas vezes: trancada pelo PIN (PBKDF2, 310 mil rodadas) e, se ativada, pela biometria
//   (chave de acesso com a extensão PRF, que devolve um segredo só depois da digital).
// - Nada disso sai do aparelho. Sem o PIN ou a digital, o cofre é só um monte de letras sem sentido.
var COFRE = 'wrkz_cofre', ERROS = 'wrkz_erros', PREF_BLOQ = 'wrkz_bloquear', PREF_DISC = 'wrkz_discreto';
var CX = null, DKRAW = null, PENDENTE = null, NA_BIO = false;
var TV = { modo: '', pin: '', primeiro: '', ocupado: false };
var SAIU_EM = 0, ULTIMO_TOQUE = Date.now(), INATIVO_MS = 5 * 60 * 1000;
var DISCRETO = localStorage.getItem(PREF_DISC) === '1';
var TE = new TextEncoder(), TD = new TextDecoder();

function rnd(n) { return crypto.getRandomValues(new Uint8Array(n)); }
function b64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function aesKey(raw) { return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']); }
function chavePin(pin, salt) {
  return crypto.subtle.importKey('raw', TE.encode(pin), 'PBKDF2', false, ['deriveKey']).then(function (k) {
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 310000, hash: 'SHA-256' }, k,
      { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  });
}
function cifrar(key, bytes) {
  var iv = rnd(12);
  return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, bytes).then(function (ct) { return { iv: b64(iv), ct: b64(ct) }; });
}
function decifrar(key, o) {
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.iv) }, key, unb64(o.ct)).then(function (b) { return new Uint8Array(b); });
}
function lerCofre() { try { return JSON.parse(localStorage.getItem(COFRE) || 'null'); } catch (e) { return null; } }
function gravarCofre(c) { localStorage.setItem(COFRE, JSON.stringify(c)); }

function criarCofre(cx, pin) {
  var raw = rnd(32), salt = rnd(16), c = { v: 1, bio: null };
  return aesKey(raw)
    .then(function (k) { return cifrar(k, TE.encode(JSON.stringify(cx))); })
    .then(function (d) { c.dados = d; return chavePin(pin, salt); })
    .then(function (kp) { return cifrar(kp, raw); })
    .then(function (w) {
      c.pin = { salt: b64(salt), iv: w.iv, ct: w.ct };
      gravarCofre(c); localStorage.removeItem('wrkz_conexao');   // apaga a cópia sem criptografia do passo 3
      DKRAW = raw; CX = cx;
    });
}
function abrirComRaw(raw) {
  return aesKey(raw).then(function (k) { return decifrar(k, lerCofre().dados); })
    .then(function (b) { DKRAW = raw; CX = JSON.parse(TD.decode(b)); });
}
function abrirComPin(pin) {
  var c = lerCofre();
  return chavePin(pin, unb64(c.pin.salt)).then(function (kp) { return decifrar(kp, c.pin); }).then(abrirComRaw);
}
function regravarDados(cx) {
  return aesKey(DKRAW).then(function (k) { return cifrar(k, TE.encode(JSON.stringify(cx))); })
    .then(function (d) { var c = lerCofre(); c.dados = d; gravarCofre(c); CX = cx; });
}
function regravarPin(pin) {
  var salt = rnd(16);
  return chavePin(pin, salt).then(function (kp) { return cifrar(kp, DKRAW); })
    .then(function (w) { var c = lerCofre(); c.pin = { salt: b64(salt), iv: w.iv, ct: w.ct }; gravarCofre(c); });
}

// Tentativas erradas: a partir da 5ª, espera crescente (30 s, 1 min, 2 min...). Na 10ª, o cofre é apagado.
function lerErros() { try { return JSON.parse(localStorage.getItem(ERROS) || '{"n":0,"ate":0}'); } catch (e) { return { n: 0, ate: 0 }; } }
function esperaRestante() { return Math.max(0, lerErros().ate - Date.now()); }
function registrarErro() {
  var e = lerErros(); e.n++;
  if (e.n >= 10) { apagarTudoLocal(); return null; }
  if (e.n >= 5) e.ate = Date.now() + Math.min(30000 * Math.pow(2, e.n - 5), 900000);
  localStorage.setItem(ERROS, JSON.stringify(e));
  return e;
}
function pinFraco(p) {
  return /^(\d)\1{5}$/.test(p) || '01234567890'.indexOf(p) >= 0 || '09876543210'.indexOf(p) >= 0;
}

// ----- tela do PIN -----
function mostrarTrava(modo, msg, semBio) {
  TV.modo = modo; TV.pin = ''; TV.ocupado = false;
  var c = lerCofre(), temBio = modo === 'abrir' && c && c.bio;
  var tit = { abrir: 'Digite seu PIN', criar1: 'Crie um PIN de 6 dígitos', criar2: 'Repita o PIN',
              trocar1: 'Novo PIN de 6 dígitos', trocar2: 'Repita o novo PIN' }[modo];
  var sub = { abrir: 'O app está bloqueado.' + (temBio ? ' Use a digital ou o PIN.' : ''),
              criar1: 'Ele tranca a URL e a chave guardadas neste aparelho. Não use datas fáceis.',
              criar2: 'Digite de novo para confirmar.', trocar1: 'Ele vai substituir o PIN atual.', trocar2: 'Digite de novo para confirmar.' }[modo];
  var teclas = ['1', '2', '3', '4', '5', '6', '7', '8', '9', temBio ? 'bio' : '', '0', 'apagar'];
  var el = document.getElementById('trava');
  el.innerHTML = '<div class="tv-ico">' + ico('cadeado', 26) + '</div>' +
    '<h2 class="tv-tit">' + tit + '</h2><p class="tv-sub">' + sub + '</p>' +
    '<div class="tv-pontos" id="tv-pontos">' + new Array(7).join('<i></i>') + '</div>' +
    '<div class="tv-msg" id="tv-msg" role="status">' + esc(msg || '') + '</div>' +
    '<div class="tv-teclado">' + teclas.map(function (k) {
      if (!k) return '<button class="sem" tabindex="-1" aria-hidden="true"></button>';
      if (k === 'bio') return '<button data-act="tv-bio" aria-label="Usar biometria">' + ico('digital', 28) + '</button>';
      if (k === 'apagar') return '<button class="sem" data-act="tv-apagar" aria-label="Apagar">' + ico('apagar', 26) + '</button>';
      return '<button data-act="tv-d" data-d="' + k + '">' + k + '</button>';
    }).join('') + '</div>' +
    (modo === 'trocar1' || modo === 'trocar2' ? '<button class="tv-link" data-act="tv-cancelar">Cancelar</button>' : '') +
    (modo === 'abrir' ? '<button class="tv-link" data-act="tv-esqueci">Esqueci o PIN</button>' : '');
  el.hidden = false;
  if (temBio && !msg && !semBio && !document.hidden) setTimeout(abrirComBio, 350);
}
function esconderTrava() { var el = document.getElementById('trava'); el.hidden = true; el.innerHTML = ''; TV.modo = ''; }
function travaVisivel() { return !document.getElementById('trava').hidden; }
function tvPontos() {
  var p = document.querySelectorAll('#tv-pontos i');
  for (var i = 0; i < p.length; i++) p[i].className = i < TV.pin.length ? 'on' : '';
}
function tvMsg(t, neutro) { var m = document.getElementById('tv-msg'); if (m) { m.textContent = t; m.className = 'tv-msg' + (neutro ? ' neutro' : ''); } }
function tremer() { var p = document.getElementById('tv-pontos'); if (p) { p.className = 'tv-pontos erro'; } }

function tvDigito(d) {
  if (TV.ocupado || TV.pin.length >= 6) return;
  var w = esperaRestante();
  if (TV.modo === 'abrir' && w) { tvMsg('Aguarde ' + Math.ceil(w / 1000) + ' s para tentar de novo.'); return; }
  TV.pin += d; tvPontos();
  if (TV.pin.length === 6) setTimeout(tvConcluir, 120);
}
function tvApagar() { if (TV.ocupado) return; TV.pin = TV.pin.slice(0, -1); tvPontos(); }

function tvConcluir() {
  var pin = TV.pin, modo = TV.modo;
  if (modo === 'criar1' || modo === 'trocar1') {
    if (pinFraco(pin)) { mostrarTrava(modo, 'Esse PIN é fácil de adivinhar. Escolha outro.'); tremer(); return; }
    mostrarTrava(modo === 'criar1' ? 'criar2' : 'trocar2'); TV.primeiro = pin; return;
  }
  if (modo === 'criar2' || modo === 'trocar2') {
    var volta = modo === 'criar2' ? 'criar1' : 'trocar1';
    if (pin !== TV.primeiro) { mostrarTrava(volta, 'Os dois PINs ficaram diferentes. Comece de novo.'); tremer(); return; }
    TV.ocupado = true; tvMsg('Salvando…', true);
    (modo === 'criar2' ? criarCofre(PENDENTE, pin) : regravarPin(pin))
      .then(function () {
        PENDENTE = null; esconderTrava(); ULTIMO_TOQUE = Date.now();
        toast(modo === 'criar2' ? 'PIN criado' : 'PIN trocado');
        if (modo === 'criar2') { D = null; load(); }
      })
      .catch(function (e) { mostrarTrava(volta, 'Não deu para salvar: ' + e.message); });
    return;
  }
  // modo abrir
  TV.ocupado = true; tvMsg('Conferindo…', true);
  abrirComPin(pin).then(desbloqueado).catch(function () {
    var r = registrarErro();
    if (!r) { esconderTrava(); telaConexao(); toast('Muitas tentativas erradas: a conexão foi apagada deste aparelho. Conecte de novo.', true); return; }
    var resta = 10 - r.n, w = esperaRestante();
    mostrarTrava('abrir', 'PIN incorreto.' + (w ? ' Aguarde ' + Math.ceil(w / 1000) + ' s.' : '') +
      (resta <= 5 ? ' Restam ' + resta + ' tentativas antes de apagar a conexão deste aparelho.' : ''), true);
    tremer();
  });
}
function desbloqueado() {
  TV.ocupado = false; localStorage.removeItem(ERROS);
  esconderTrava(); ULTIMO_TOQUE = Date.now(); D = null; LOCAL_OK = false; load();
}
function esqueciPin() {
  if (!confirm('Sem o PIN, a conexão deste aparelho será apagada. Depois é só conectar de novo com a URL e a chave. Continuar?')) return;
  apagarTudoLocal(); esconderTrava(); telaConexao();
}

// ----- biometria (chave de acesso com PRF) -----
function bioPrf(credId, salt) {
  NA_BIO = true;
  return navigator.credentials.get({ publicKey: {
      challenge: rnd(32), rpId: location.hostname, timeout: 60000, userVerification: 'required',
      allowCredentials: [{ type: 'public-key', id: credId }],
      extensions: { prf: { eval: { first: salt } } } } })
    .then(function (cred) {
      NA_BIO = false;
      var r = cred.getClientExtensionResults().prf;
      if (!r || !r.results || !r.results.first) throw new Error('SEM_PRF');
      return new Uint8Array(r.results.first);
    }, function (e) { NA_BIO = false; throw e; });
}
function abrirComBio() {
  var c = lerCofre();
  if (!c || !c.bio || TV.ocupado || TV.modo !== 'abrir') return;
  TV.ocupado = true; tvMsg('Toque no sensor…', true);
  bioPrf(unb64(c.bio.cred), unb64(c.bio.salt))
    .then(function (prf) { return aesKey(prf).then(function (k) { return decifrar(k, c.bio); }); })
    .then(abrirComRaw).then(desbloqueado)
    .catch(function (e) {
      TV.ocupado = false;
      tvMsg(e && e.name === 'NotAllowedError' ? 'Biometria cancelada. Digite o PIN ou toque na digital.' : 'A biometria não funcionou. Digite o PIN.');
    });
}
function ativarBio() {
  if (!window.PublicKeyCredential || !DKRAW) { toast('Biometria não disponível neste navegador.', true); return; }
  var salt = rnd(32), raw = DKRAW;
  NA_BIO = true;
  navigator.credentials.create({ publicKey: {
      rp: { name: 'Contas Wesley', id: location.hostname },
      user: { id: rnd(16), name: 'contas', displayName: 'Contas Wesley' },
      challenge: rnd(32), timeout: 60000,
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'preferred', userVerification: 'required' },
      extensions: { prf: { eval: { first: salt } } } } })
    .then(function (cred) {
      NA_BIO = false;
      var credId = new Uint8Array(cred.rawId), r = cred.getClientExtensionResults().prf || {};
      if (r.results && r.results.first) return { credId: credId, prf: new Uint8Array(r.results.first) };
      if (r.enabled === false) throw new Error('SEM_PRF');
      return bioPrf(credId, salt).then(function (prf) { return { credId: credId, prf: prf }; });
    })
    .then(function (x) {
      return aesKey(x.prf).then(function (k) { return cifrar(k, raw); }).then(function (w) {
        var c = lerCofre(); c.bio = { cred: b64(x.credId), salt: b64(salt), iv: w.iv, ct: w.ct }; gravarCofre(c);
      });
    })
    .then(function () { toast('Biometria ativada'); if (FOLHA === 'config') folhaConfig(); })
    .catch(function (e) {
      NA_BIO = false;
      toast(e.message === 'SEM_PRF' ? 'Este aparelho não oferece biometria com criptografia para sites. Continue usando o PIN.' :
            e.name === 'NotAllowedError' ? 'Ativação cancelada.' : 'Não deu para ativar: ' + e.message, true);
    });
}
function desativarBio() {
  if (!confirm('Desativar a biometria? O app passa a abrir só com o PIN.')) return;
  var c = lerCofre(); c.bio = null; gravarCofre(c);
  toast('Biometria desativada'); if (FOLHA === 'config') folhaConfig();
}

// ----- bloqueio automático -----
function tempoBloq() { var v = localStorage.getItem(PREF_BLOQ); return v === null ? 60000 : Number(v); }
function travar(semBio) {
  apagarSessao();
  if (!CX || !lerCofre()) return;
  CX = null; DKRAW = null; D = null; CACHE = null; FILA = []; APRENDIDAS = {}; LOCAL_OK = false; MODO_OFF = false;
  fecharFolha();
  document.getElementById('app').innerHTML = '';
  document.getElementById('nav').innerHTML = '';
  document.getElementById('titulo').textContent = 'Bloqueado';
  document.getElementById('subtitulo').textContent = '';
  mostrarTrava('abrir', '', semBio);
}
// Sessão curta: ao sair do app, a chave aberta fica guardada só até o fim do tempo escolhido (sessionStorage,
// que o Android apaga quando o app é fechado de vez). Assim, se o Android recarregar o app nesse meio tempo,
// ele volta sem pedir digital. Passou do tempo, a sessão é apagada e o PIN ou a digital voltam a ser pedidos.
var K_SESSAO = 'wrkz_sessao';
function guardarSessao() {
  try { if (CX && DKRAW && tempoBloq() > 0) sessionStorage.setItem(K_SESSAO, JSON.stringify({ dk: b64(DKRAW), ate: Date.now() + tempoBloq() })); } catch (e) {}
}
function apagarSessao() { try { sessionStorage.removeItem(K_SESSAO); } catch (e) {} }
function sessaoValida() {
  try {
    var s = JSON.parse(sessionStorage.getItem(K_SESSAO) || 'null');
    if (s && s.ate > Date.now()) return unb64(s.dk);
  } catch (e) {}
  apagarSessao(); return null;
}
window.addEventListener('pagehide', function () { if (!NA_BIO) { SAIU_EM = Date.now(); guardarSessao(); } });
document.addEventListener('visibilitychange', function () {
  if (NA_BIO) return;                                   // a janela da digital não conta como "sair do app"
  if (document.hidden) { SAIU_EM = Date.now(); if (tempoBloq() === 0) travar(true); else guardarSessao(); return; }
  if (CX && SAIU_EM && Date.now() - SAIU_EM >= tempoBloq()) travar(true);
  else apagarSessao();
  SAIU_EM = 0;
  var c = lerCofre();
  if (TV.modo === 'abrir' && travaVisivel() && c && c.bio && !TV.ocupado) setTimeout(abrirComBio, 350);
});
['click', 'touchstart', 'keydown'].forEach(function (t) {
  document.addEventListener(t, function () { ULTIMO_TOQUE = Date.now(); }, { passive: true });
});
setInterval(function () { if (CX && !NA_BIO && Date.now() - ULTIMO_TOQUE > INATIVO_MS) travar(); }, 15000);

// ----- folha: arrastar a alça para baixo fecha -----
(function () {
  var folha = document.getElementById('folha'), y0 = null, dy = 0;
  folha.addEventListener('touchstart', function (ev) {
    var naAlca = ev.target.closest('.alca');
    var noTopo = folha.scrollTop <= 0 && ev.touches[0].clientY - folha.getBoundingClientRect().top < 56;
    if (!naAlca && !noTopo) { y0 = null; return; }
    y0 = ev.touches[0].clientY; dy = 0;
    folha.classList.remove('voltando'); folha.classList.add('arrastando');
  }, { passive: true });
  folha.addEventListener('touchmove', function (ev) {
    if (y0 === null) return;
    dy = Math.max(0, ev.touches[0].clientY - y0);
    if (dy > 0 && ev.cancelable) ev.preventDefault();   // enquanto arrasta a janela, o Chrome não recarrega a página
    folha.style.transform = 'translateY(' + dy + 'px)';
  }, { passive: false });
  function soltar() {
    if (y0 === null) return;
    y0 = null; folha.classList.remove('arrastando');
    if (dy > 90) { folha.style.transform = ''; fecharFolha(); return; }
    folha.classList.add('voltando'); folha.style.transform = '';
  }
  folha.addEventListener('touchend', soltar);
  folha.addEventListener('touchcancel', soltar);
  // Tocar na alça também fecha (para quem não arrasta)
  folha.addEventListener('click', function (ev) { if (ev.target.closest('.alca')) fecharFolha(); });
})();

function folhaConfig() {

    '<h3 class="sec">Aparência</h3>' +

// Entende o código lido ou colado. Devolve true se reconheceu.
function usarCodigo(txt, automatico) {

    var p = lerPix(txt);
    if (!p) { if (!automatico) toast('Código Pix não reconhecido', true); return false; }
    var nome = titulo(p.nome);
    pararCamera();
    preencherLanc({ tipo: 'Gasto', sit: 'pago', valor: p.valor, data: D.hoje, desc: 'Pix ' + (nome || 'sem nome'), cat: sugerirCategoria(nome),
      aviso: p.valor ? 'Pix lido. Confira e toque em Lançar.' : 'Pix lido. Este QR não traz o valor: digite o valor.' });
    return true;
  }

  else if (n.length === 48) cb = n.slice(0, 11) + n.slice(12, 23) + n.slice(24, 35) + n.slice(36, 47);
  var b = cb ? lerBoleto(cb) : null;

  pararCamera();

var BANCOS = { '001': 'Banco do Brasil', '033': 'Santander', '104': 'Caixa', '237': 'Bradesco', '341': 'Itaú', '260': 'Nubank', '077': 'Inter',
  '336': 'C6', '212': 'Original', '748': 'Sicredi', '756': 'Sicoob', '422': 'Safra', '041': 'Banrisul', '070': 'BRB', '380': 'PicPay', '323': 'Mercado Pago' };

  '5': ['Órgão público', 'Outros'], '6': ['Carnê', 'Outros'], '7': ['Multa de trânsito', 'Transporte'], '9': ['Conta', 'Outros'] };

}

function vencPorFator(f) {

// Pix "copia e cola" (padrão BR Code): lê só valor e nome de quem recebe. A chave Pix não é guardada.

var MESES_FALA = ['janeiro', 'fevereiro', 'marco', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
var DIAS_FALA = (function () {
  var u = ['', 'um', 'dois', 'tres', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'], m = { primeiro: 1 };
  ['um', 'dois', 'tres', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove']
    .forEach(function (w, i) { m[w] = i + 1; });

// Acha uma data falada. Devolve { iso, trecho } ou null. Com noPassado, "dia 10" fica no mês atual mesmo se já passou.
function extrairData(s, noPassado) {
  var palavras = Object.keys(DIAS_FALA).sort(function (a, b) { return b.length - a.length; }).join('|');
  var re = new RegExp('\\bdia (\\d{1,2}|' + palavras + ')\\b(?: de (' + MESES_FALA.join('|') + '))?');

  else {
    var b = s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
    if (b) { dia = Number(b[1]); mes = Number(b[2]); trecho = b[0]; }

  var ano = Number(D.hoje.slice(0, 4)), mesAtual = Number(D.hoje.slice(5, 7));
  var iso = ano + '-' + pad2(mes || mesAtual) + '-' + pad2(dia);

// Monta o "contrário" da alteração que acabou de ser salva. Devolve true se ofereceu o Desfazer.
function oferecerDesfazer(op, antes, depois) {
  var a = op.args || [], x = a[0], r = null;
  if (!antes || !depois) return false;
  if (op.fn === 'lancar' && x) {
    var desc = String(x.desc || '').trim(), cand = [];
    if (x.tipo === 'Cartão') (depois.cartoes || []).forEach(function (k) { (k.compras || []).forEach(function (c) { if (c.desc === desc) cand.push({ linha: c.linha, parc: !!c.parcela }); }); });
    else if ((x.situacao || 'pago') === 'pendente') ((x.tipo === 'Entrada' ? depois.recebiveis : depois.planejados) || []).forEach(function (p) { if (p.desc === desc) cand.push({ linha: p.linha }); });
    else (depois.extrato || []).forEach(function (m) { if (m.desc === desc && m.removivel) cand.push({ linha: m.linha }); });
    cand.sort(function (p, q) { return q.linha - p.linha; });
    if (cand.length) r = { texto: 'Lançado: ' + desc, fn: 'excluirLancamento', args: [cand[0].linha, !!cand[0].parc] };
  }
  if (op.fn === 'pagarConta') r = { texto: 'Conta marcada como paga', fn: 'desfazerConta', args: [a[0]] };
  if (op.fn === 'pagarFatura') r = { texto: 'Fatura marcada como paga', fn: 'desfazerFatura', args: [a[0]] };
  if (op.fn === 'desfazerConta') { var f = achar(antes.fixas, a[0]); if (f && f.ok) r = { texto: 'Pagamento desfeito', fn: 'pagarConta', args: [a[0], f.pago] }; }
  if (op.fn === 'desfazerFatura') { var g = achar(antes.faturas, a[0]); if (g && g.ok) r = { texto: 'Pagamento da fatura desfeito', fn: 'pagarFatura', args: [a[0], g.pago] }; }
  if (op.fn === 'ajustarConta') { var f2 = achar(antes.fixas, a[0]); if (f2) r = { texto: 'Valor do mês alterado', fn: 'ajustarConta', args: [a[0], f2.ajustado ? f2.previsto : ''] }; }
  if (op.fn === 'definirFatura') {
    var g2 = achar(a[1] === antes.ciclo.chave ? antes.faturas : antes.prox && antes.prox.faturas, a[0]);
    r = { texto: 'Valor da fatura alterado', fn: 'definirFatura', args: [a[0], a[1], g2 && g2.informado != null ? g2.informado : ''] };
  }
  if (op.fn === 'salvarVencimento') { var f3 = achar(antes.fixas, a[0]); if (f3) r = { texto: 'Vencimento alterado', fn: 'salvarVencimento', args: [a[0], f3.dia == null ? '' : f3.dia, !!f3.mesSeguinte] }; }
  if (op.fn === 'salvarConfig' && antes.config && antes.config[a[0]] !== '' && antes.config[a[0]] != null) r = { texto: 'Ajuste salvo', fn: 'salvarConfig', args: [a[0], antes.config[a[0]]] };
  if (!r) return false;
  mostrarDesfazer(r.texto, function () { DESFAZENDO = true; call.apply(null, [r.fn].concat(r.args)); });
  return true;
}

// ---------- lembrete de vencimento (topo do Início, uma vez por dia) ----------
function cardLembrete() {
  if (!D || localStorage.getItem('wrkz_lembrete') === D.hoje) return '';
  var amanha = isoSoma(D.hoje, 1);
  var itens = itensAgenda('atual').filter(function (i) { return !i.ok && i.data && i.tipo !== 'receber' && i.data <= amanha; })
    .sort(function (a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : 0; });
  if (!itens.length) return '';
  var atras = itens.some(function (i) { return i.data < D.hoje; });
  return '<div class="painel lembrete">' + cab(atras ? 'Atrasadas e vencendo' : 'Vence hoje e amanhã', 'Toque no círculo quando pagar', '') +
    itens.map(function (i) { return itemAgenda(i, true, true); }).join('') +
    '<button class="btn full" data-act="lembrete-ok" style="margin-top:10px">Ok, já vi</button></div>';
}

// ---------- Planos, aba Análises: alertas, comparativo, assinaturas e relatório ----------
function comparativo() {
  var h = D.historico || [], ult = h[h.length - 1], ult3 = h.slice(-3), cats = {}, atual = D.categorias || {};
  Object.keys(atual).forEach(function (k) { cats[k] = 1; });
  ult3.forEach(function (x) { Object.keys(x.categorias || {}).forEach(function (k) { cats[k] = 1; }); });
  return Object.keys(cats).map(function (k) {
    return { cat: k, atual: atual[k] || 0, anterior: ult ? (ult.categorias || {})[k] || 0 : 0,
             media: ult3.length ? ult3.reduce(function (s, x) { return s + ((x.categorias || {})[k] || 0); }, 0) / ult3.length : 0 };
  }).sort(function (a, b) { return b.atual - a.atual; });
}
function calcularAlertas() {
  var a = [], hoje = D.hoje, amanha = isoSoma(hoje, 1);
  var itens = itensAgenda('atual').filter(function (i) { return !i.ok && i.data && i.tipo !== 'receber'; });
  var nomes = function (l) { return l.map(function (i) { return i.nome; }).join(', ') + '.'; };
  var atras = itens.filter(function (i) { return i.data < hoje; }), hj = itens.filter(function (i) { return i.data === hoje; }), am = itens.filter(function (i) { return i.data === amanha; });
  if (atras.length) a.push({ nivel: 'neg', titulo: atras.length === 1 ? '1 conta atrasada' : atras.length + ' contas atrasadas', texto: nomes(atras) });
  if (hj.length) a.push({ nivel: 'warn', titulo: 'Vence hoje', texto: nomes(hj) });
  if (am.length) a.push({ nivel: 'warn', titulo: 'Vence amanhã', texto: nomes(am) });
  if (D.limiteUsado > 0) a.push({ nivel: 'neg', titulo: 'Usando o limite da conta', texto: brl(D.limiteUsado) + ' do cheque especial em uso agora.' });
  else if (D.livre < 0) a.push({ nivel: 'neg', titulo: 'O ciclo não fecha', texto: 'Pagando tudo o que falta, faltam ' + brl(-D.livre) + ', que sairiam do limite.' });
  var h = D.historico || [], ult3 = h.slice(-3);
  if (ult3.length) {
    var passados = D.ciclo.diasTotal - D.ciclo.dias;
    var media = ult3.reduce(function (s, x) { return s + x.gastos; }, 0) / ult3.length, esperado = media * passados / D.ciclo.diasTotal;
    var gastos = (D.totais && D.totais.gastos) || 0;
    if (passados >= 5 && gastos > esperado * 1.25 && gastos - esperado > 50)
      a.push({ nivel: 'warn', titulo: 'Gastos acima do ritmo', texto: 'Já foram ' + brl(gastos) + ' em gastos do dia a dia. Pela média dos últimos ciclos, o normal até aqui seria ' + brl(esperado) + '.' });
    comparativo().filter(function (c) { return c.media > 0 && c.atual > c.media * 1.3 && c.atual - c.media > 50; }).slice(0, 3).forEach(function (c) {
      a.push({ nivel: 'warn', titulo: c.cat + ' acima da média', texto: brl(c.atual) + ' previstos neste ciclo, contra ' + brl(c.media) + ' de média.' });
    });
    var fat = (D.totais && D.totais.faturasPrevisto) || 0, fatAnt = h[h.length - 1].faturas;
    if (fatAnt > 0 && fat > fatAnt * 1.3 && fat - fatAnt > 100)
      a.push({ nivel: 'warn', titulo: 'Fatura maior que a do ciclo passado', texto: brl(fat) + ' neste ciclo, contra ' + brl(fatAnt) + ' no anterior.' });
  }
  var fora = (D.assinaturas || []).filter(function (s) { return !s.cadastrada && s.ciclos >= 2; });
  if (fora.length) a.push({ nivel: '', titulo: 'Assinaturas fora das contas fixas', texto: fora.map(function (s) { return s.nome; }).join(', ') + '. Cadastre como conta fixa para o painel contar com elas todo mês.' });
  return a;
}

    }).join('') : '<div class="vazio">Quando um gasto se repetir todo ciclo com valor parecido (ou tiver nome de assinatura, como Netflix ou Spotify), ele aparece aqui.</div>') + '</div>';

  h += '<div class="painel">' + cab('Relatório do ciclo em PDF', 'Resumo de ' + D.ciclo.mes + ' para guardar ou compartilhar', 'relatorio') +

  h += '<div class="painel">' + cab('Buscar lançamentos', 'Em todos os ciclos, pela descrição ou categoria', '') +

function buscaLocal(t) {

    if (semAcento(desc).indexOf(q) >= 0 || semAcento(categoria) === q) itens.push({ desc: desc, valor: valor, tipo: tipo, categoria: categoria, data: data, ano: '', ciclo: D.ciclo.nome, parcela: parcela || '' });
  };
  (D.extrato || []).forEach(function (m) { add(m.desc, m.valor, m.tipo, m.categoria, m.data); });
  (D.cartoes || []).forEach(function (k) { (k.compras || []).forEach(function (c) { add(c.desc, c.valor, 'Cartão', c.categoria, c.data, c.parcela); }); });
  (D.planejados || []).forEach(function (p) { add(p.desc, p.valor, 'Planejado', p.categoria, p.data); });
  (D.recebiveis || []).forEach(function (p) { add(p.desc, p.valor, 'A receber', '', p.data); });
  var ent = function (x) { return x.tipo === 'Entrada' || x.tipo === 'A receber'; };
  var s = itens.filter(function (x) { return !ent(x); }).reduce(function (a, x) { return a + x.valor; }, 0), e = itens.filter(ent).reduce(function (a, x) { return a + x.valor; }, 0);
  return { total: itens.length, saidas: s, entradas: e, porCiclo: itens.length ? [{ nome: D.ciclo.nome, saidas: s, entradas: e, qtd: itens.length }] : [], itens: itens };
}

      '<div class="sub">' + esc(x.tipo) + (x.data ? ' em ' + x.data + (x.ano ? '/' + x.ano : '') : '') + ', ciclo ' + esc(x.ciclo) + (x.parcela ? ', parcela ' + esc(x.parcela) : '') + '</div></div>' +

// Ditado curto: preenche um campo falando (usado na busca).
function ditar(idCampo, depois) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, campo = document.getElementById(idCampo);
  if (!SR || !campo) { toast('Este navegador não tem reconhecimento de voz.', true); return; }
  var r = new SR(); r.lang = 'pt-BR'; r.interimResults = true;
  campo.placeholder = 'Ouvindo…';
  r.onresult = function (ev) { var t = ''; for (var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript; campo.value = t; };
  r.onend = function () { campo.placeholder = 'Ex.: mercado, uber, farmácia'; if (campo.value && depois) depois(campo.value); };
  r.onerror = function () { campo.placeholder = 'Não ouvi. Toque no microfone de novo.'; };
  try { r.start(); } catch (e) {}
}

// Segurar o botão + por meio segundo abre direto a voz (tocar normal continua abrindo o lançamento).
(function () {
  var timer = null, longo = false;
  document.addEventListener('touchstart', function (ev) {
    var b = ev.target.closest && ev.target.closest('[data-act="lancar"]');
    if (!b) return;
    longo = false;
    timer = setTimeout(function () { longo = true; if (navigator.vibrate) navigator.vibrate(20); folhaVoz(true); }, 500);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(function (t) { document.addEventListener(t, function () { clearTimeout(timer); }, { passive: true }); });
  document.addEventListener('click', function (ev) {
    if (longo && ev.target.closest && ev.target.closest('[data-act="lancar"]')) { longo = false; ev.stopImmediatePropagation(); ev.preventDefault(); }
  }, true);
  document.addEventListener('contextmenu', function (ev) { if (ev.target.closest && ev.target.closest('[data-act="lancar"]')) ev.preventDefault(); });
})();

// ---------- botão voltar do celular ----------
// Enquanto houver algo para "voltar" (uma janela aberta ou outra tela que não o Início), o app guarda um passo no
// histórico. O voltar do Android consome esse passo: fecha a janela ou volta para o Início, em vez de sair do app.
var VOLTA_ARMADA = false, VOLTA_IGNORAR = false, VOLTA_T = null;
function temOndeVoltar() { return !travaVisivel() && (!!FOLHA || (!!D && PAG !== 'inicio')); }
function agendarVoltar() { clearTimeout(VOLTA_T); VOLTA_T = setTimeout(sincronizarVoltar, 60); }
function sincronizarVoltar() {
  if (temOndeVoltar() && !VOLTA_ARMADA) { history.pushState({ wrkz: 1 }, ''); VOLTA_ARMADA = true; }
  else if (!temOndeVoltar() && VOLTA_ARMADA) { VOLTA_ARMADA = false; VOLTA_IGNORAR = true; history.back(); }
}
window.addEventListener('popstate', function () {
  if (VOLTA_IGNORAR) { VOLTA_IGNORAR = false; return; }
  VOLTA_ARMADA = false;
  if (travaVisivel()) return;
  if (FOLHA) fecharFolha();
  else if (D && PAG !== 'inicio') { PAG = 'inicio'; render(); window.scrollTo(0, 0); }
  agendarVoltar();
});

    '<div class="hero-top"><span class="hero-tit">Livre até o salário' + ajuda('livre') + '</span><span class="chip">' + d.ciclo.dias + (d.ciclo.dias === 1 ? ' dia' : ' dias') + '</span></div>' +

    '<div><small>Falta pagar</small><b class="num">' + brl(d.faltaPagar) + '</b></div></div></section>';

  if (d.limiteUsado > 0) {
    h += '<div class="aviso neg">Você está usando ' + brl(d.limiteUsado) + ' do limite da conta.' +
      (d.limite ? ' Ainda restam ' + brl(d.limiteDisponivel) + ' de limite.' : '') + '</div>';

    '<div class="sub" style="margin-bottom:6px">' + pctTxt(pct) + ' do próximo salário já está comprometido</div>' +
    linha((p.sobra >= 0 ? 'Sobra de ' : 'Falta de ') + d.ciclo.mes, p.sobra, 'cor') +
    linha('Salário', p.salario) +

    linha('Contas fixas de ' + p.mes, -p.fixas) +

    '<div class="info"><div class="nome">' + esc(m.desc) + '</div><div class="sub">' + rot + m.data + (m.tipo === 'Gasto' && m.categoria ? ', ' + esc(m.categoria) : '') + '</div></div>' +

function cardReserva() {
  var r = D.reserva;
  return '<div class="painel">' + cab('Reserva', 'Meta de ' + r.meses + ' meses de custo fixo', 'reserva', '<b class="num">' + brl(r.hoje) + '</b>') +
    '<div class="barra"><span style="width:' + (r.pct * 100) + '%;background:var(--pos)"></span></div>' +
    '<div class="sub">' + (r.pct >= 1 ? 'Meta atingida' : pctTxt(r.pct) + ' de ' + brl(r.alvo)) + '</div></div>';
}

function donut(t) {
  var itens = Object.keys(t).filter(function (k) { return t[k] > 0; })
    .map(function (k) { return { nome: k, valor: t[k] }; })
    .sort(function (a, b) { return b.valor - a.valor; });
  var tot = itens.reduce(function (s, i) { return s + i.valor; }, 0);
  if (!tot) return '<div class="vazio">Nenhuma saída neste ciclo.</div>';
  var R = 52, C = 2 * Math.PI * R, off = 0;
  var s = '<svg viewBox="0 0 140 140" role="img" aria-label="Saídas por categoria"><circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--soft)" stroke-width="18"/>';
  itens.forEach(function (i) {
    var len = i.valor / tot * C;
    s += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + cor(i.nome) + '" stroke-width="18" stroke-dasharray="' + len + ' ' + (C - len) +
      '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"/>';
    off += len;
  });
  s += '<text x="70" y="64" text-anchor="middle">Total</text><text class="dv" x="70" y="84" text-anchor="middle">' + Math.round(tot).toLocaleString('pt-BR') + '</text></svg>';
  return '<div class="cat">' + s + '<div class="leg">' + itens.map(function (i) {
    return '<div class="l"><span><span class="dot" style="background:' + cor(i.nome) + '"></span>' + esc(i.nome) + '</span><span class="num">' +
      brl(i.valor) + ' (' + Math.round(i.valor / tot * 100) + '%)</span></div>';
  }).join('') + '</div></div>';
}

        '<button class="chk feito" data-act="desfazer" data-id="' + c.id + '" data-nome="' + esc(c.nome) + '" aria-label="Desfazer pagamento">' + ico('check', 18) + '</button></div>';
    }
    return '<div class="item">' + avatar(c.nome, c.categoria) + info + '<input class="inp-pg num" id="pg-' + c.id + '" data-act="aj-conta" data-id="' + c.id +
      '" inputmode="decimal" value="' + dec(c.previsto) + '" aria-label="Valor do mês">' +
      '<button class="chk" data-act="pagar" data-id="' + c.id + '" aria-label="Marcar como paga">' + ico('check', 18) + '</button></div>';
  }).join('') : '<div class="vazio">Nenhuma conta ativa neste ciclo.</div>') + '</div>';

  if (D.planejados.length || D.recebiveis.length) {
    var itemPl = function (p, receber) {
      return '<div class="item">' + (receber ? '<span class="av" style="background:var(--pos-soft);color:var(--pos)">' + ico('entra', 18) + '</span>' : avatar(p.desc, p.categoria)) +
        '<div class="info"><div class="nome">' + esc(p.desc) + '</div><div class="sub">' + (receber ? 'A receber' : 'Planejado, ' + esc(p.categoria || 'Outros')) + '</div></div>' +
        '<input class="inp-pg num" id="pl-' + p.linha + '" inputmode="decimal" value="' + dec(p.valor) + '" aria-label="Valor">' +
        '<button class="chk" data-act="efetivar" data-linha="' + p.linha + '" aria-label="' + (receber ? 'Marcar como recebido' : 'Marcar como pago') + '">' + ico('check', 18) + '</button>' +
        '<button class="x" data-act="lexc" data-linha="' + p.linha + '" aria-label="Excluir">' + ico('x', 16) + '</button></div>';
    };
    h += '<div class="painel">' + cab('Planejados e a receber', 'Deste ciclo', 'planejados') +
      D.planejados.map(function (p) { return itemPl(p, false); }).join('') +
      D.recebiveis.map(function (p) { return itemPl(p, true); }).join('') + '</div>';
  }
  h += '</div><div>';

  if (D.dividas.length) {
    h += '<div class="painel">' + cab('Dívidas e parcelamentos', '', 'dividas') + D.dividas.map(function (dv) {
      return '<div class="item">' + avatar(dv.nome, 'Dívidas') + '<div class="info"><div class="nome">' + esc(dv.nome) +
        (dv.faltam === 0 ? '<span class="tag">Quitada</span>' : '') + '</div>' +
        '<div class="barra"><span style="width:' + (dv.pagas / dv.meses * 100) + '%;background:var(--pos)"></span></div>' +
        '<div class="sub">' + dv.pagas + ' de ' + dv.meses + ' parcelas, termina em ' + dv.fim + '</div></div>' +
        '<div class="valor num">' + brl(dv.totalFalta) + '</div></div>';
    }).join('') + '</div>';
  }

  h += '<div class="painel">' + cab('Cadastro de contas fixas', 'Valor padrão de todos os meses', 'cadastro') +
    D.contas.map(function (c) {
      return '<button class="item" data-act="editar" data-id="' + c.id + '">' + avatar(c.nome, c.categoria) +
        '<div class="info"><div class="nome">' + esc(c.nome) + (!c.ativa ? '<span class="tag warn">Pausada</span>' : '') + '</div>' +
        '<div class="sub">' + esc(c.categoria) + (c.meses !== '' ? ', ' + c.meses + ' ciclos desde ' + nomeC(c.inicio) : '') + '</div></div>' +
        '<div class="valor num">' + brl(c.valor) + '</div></button>';
    }).join('') +
    '<button class="btn full" style="margin-top:12px" data-act="editar" data-id="">Nova conta fixa</button></div>';
  return h + '</div></div>';
}

// ----- Cartão -----

    };

      (a.ok ? linha('Fatura de ' + D.ciclo.mes + ' (paga)', a.pago) : editor('Fatura de ' + D.ciclo.mes, a, D.ciclo.chave, 'fa-' + k.id)) +
      editor('Próxima fatura (' + D.proximo.mes + ')', pr, D.proximo.chave, 'fp-' + k.id) +
